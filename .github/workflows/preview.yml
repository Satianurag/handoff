name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy preview backend and static site
        id: deploy
        run: node scripts/deploy-preview.mjs "pr-${{ github.event.pull_request.number }}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      - name: Register GitHub deployment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const environment = `preview-pr-${context.issue.number}`;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              task: "deploy",
              environment,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              description: `Convex preview for PR #${context.issue.number}`,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: process.env.PREVIEW_URL,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: "Preview deployed",
            });
      - name: Register stable preview alias
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const previewUrl = process.env.PREVIEW_URL;
            const aliasUrl = `https://handoff-pr-${pr}.satimon.com`;
            if (!previewUrl) {
              throw new Error("Preview deployment did not provide a URL.");
            }

            const token = await core.getIDToken("https://handoff-previews.satimon.com");
            const registration = await fetch("https://handoff-previews.satimon.com/register", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                pr,
                url: previewUrl,
                sha: context.payload.pull_request.head.sha,
              }),
            });
            if (registration.status !== 204) {
              const body = await registration.text();
              throw new Error(`Stable preview registration failed: HTTP ${registration.status}: ${body}`);
            }

            let verified = false;
            let lastResult = "no response";
            for (let attempt = 1; attempt <= 5; attempt += 1) {
              try {
                const response = await fetch(`${aliasUrl}/demo`, { redirect: "manual" });
                const location = response.headers.get("location");
                if (response.status === 302 && location === `${previewUrl}/demo`) {
                  verified = true;
                  break;
                }
                lastResult = `HTTP ${response.status}, Location: ${location ?? "(missing)"}`;
              } catch (error) {
                lastResult = error.message;
              }
              if (attempt < 5) {
                await new Promise((resolve) => setTimeout(resolve, 5000));
              }
            }
            if (!verified) {
              throw new Error(`Stable preview alias check failed after 5 attempts: ${lastResult}`);
            }
            await core.summary.addRaw(`${aliasUrl}\n`).write();
